# docker-compose.yml

services:
  # ----- Redis: fast in-memory notepad (cache + agent memory) -----
  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ----- Ollama: the brain (runs the open-weight LLM locally) -----
  ollama:
    image: ollama/ollama:latest
    container_name: citadel-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

# Named volumes = folders Docker manages on your disk so data survives restarts.
volumes:
  redis-data:
  ollama-data:
